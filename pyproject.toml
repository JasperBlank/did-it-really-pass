[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "did-it-pass"
version = "0.1.0"
description = "Checks your Claude Code sessions for times the agent said it worked when it didn't."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
did-it-pass = "did_it_pass.cli:main"

[project.urls]
Repository = "https://github.com/JasperBlank/did-it-pass"

[tool.setuptools]
packages = ["did_it_pass"]

[tool.setuptools.package-data]
did_it_pass = ["prompt.md"]
